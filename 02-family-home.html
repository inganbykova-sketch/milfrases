  // чтобы фразы с пунктуацией находили свои слова в словаре.
  const out = {};
  for(const [k,v] of Object.entries(raw)){
    out[k] = v;
    if(!/[.,!?;:…]$/.test(k)){
      out[k+'.'] = v;
      out[k+','] = v;
      out[k+'!'] = v;
      out[k+'?'] = v;
    }
  }
  return out;
})();
